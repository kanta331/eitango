  /* ---- カード（表・裏） ---- */
  var seq=0;
  /* 出自バッジ（TR 番号）と誤読。met は origin から、tr は tr から */
  function srcTr(c){
    if(c.tr) return c.tr;
    var t=(c.origin||[]).map(function(o){ return o.tr; }).filter(Boolean);
    return t[0]||'';
  }
  function misreads(c){
    var out=[];
    (c.origin||[]).forEach(function(o){ if(o.misread && out.indexOf(o.misread)<0) out.push(o.misread); });
    return out;
  }
  function sizeClass(w){ return w.length>14 ? ' class="xl"' : w.length>9 ? ' class="l"' : ''; }
  function cardHTML(c, kira){
    var uid='c'+(++seq)+'-'+c.id.replace(/[^\w-]/g,'_');
    var pills=(c.senses||[]).map(function(s){ return '<span>'+esc(s)+'</span>'; }).join('')
      +(c.senses_noun||[]).map(function(s){ return '<span class="n">名：'+esc(s)+'</span>'; }).join('')
      +misreads(c).map(function(m){ return '<span class="mis">誤読：'+esc(m)+'</span>'; }).join('');
    var badge=srcTr(c);
    var ex=(c.examples||[]).map(function(e){
      return '<p>'+emphasize(e.en, e.focus)+'<small>'+esc(e.ja)+'</small></p>';
    }).join('');
    return ''
      +'<div class="card'+(kira ? ' kira' : '')+'" role="button" tabindex="0" aria-label="'+esc(c.word)+' のカード。タップで裏返す、長押しで語源">'
      +  '<div class="face front">'
      +    '<div class="word"><b'+sizeClass(c.word)+'>'+esc(c.word)+'</b>'+(badge ? '<span class="badge">'+esc(badge)+'</span>' : '<span>'+esc(c.pos)+'</span>')+'</div>'
      +    (c.ipa||c.kana ? '<div class="pron"><code>'+esc(c.ipa||'')+'</code><span>'+esc(c.kana||'')+'</span></div>' : '')
      +    figure(c.image, uid)
      +    '<div class="pills">'+pills+'</div>'
      +    (c.core ? '<div class="core">'+esc(c.core)+'</div>' : '')
      +    (ex ? '<div class="ex">'+ex+'</div>' : '')
      +    '<div class="foot"><span>'+(c.set==='met' ? '出会った語' : c.set==='tr' ? '必修英文100題' : '初級語　'+esc(CATEGORY[c.category]||''))+'</span><i>'+(kira ? '◆◆◆' : '◇◇◇')+'</i></div>'
      +    (kira ? '<div class="holo"></div>' : '')
      +    '<div class="sheen"></div>'
      +  '</div>'
      +  '<div class="face back" aria-hidden="true">'+back(uid)+'</div>'
      +  '<div class="sparks"></div>'
      +'</div>';
  }

  /* カードのない語（小テスト用）：語と訳語だけ */
  function simpleHTML(w){
    return '<div class="card simple"><div class="face front">'
      +'<div class="word"><b>'+esc(w.word)+'</b><span>'+esc(CATEGORY[w.category]||'')+'</span></div>'
      +'<div class="mean">'+esc(w.meaning)+'</div>'
      +'<div class="foot"><span>初級語　'+esc(CATEGORY[w.category]||'')+'</span><i>◇◇◇</i></div>'
      +'</div></div>';
  }

  /* ---- 語源面 ---- */
  /* 一文の中の語を太字にする（注記の括弧・A/B・... を外し、大文字小文字を問わず最初の一か所） */
  function boldIn(sent, word){
    var key=word.replace(/（.*?）/g,'').split(/\s*\.\.\.\s*|\s+[AB](?=\s|$)/)[0].trim();
    var i=key ? sent.toLowerCase().indexOf(key.toLowerCase()) : -1;
    if(i<0) return esc(sent);
    return esc(sent.slice(0,i))+'<b>'+esc(sent.slice(i,i+key.length))+'</b>'+esc(sent.slice(i+key.length));
  }
  function chatBoxHTML(){
    return '<div class="chat'+(apiKey() ? '' : ' nokey')+'"><div class="chat-log" aria-live="polite"></div>'
      +'<div class="chat-tools" hidden><button type="button" class="chat-clear">この会話を消す</button></div>'
      +'<div class="chat-etym"><button type="button" class="chat-go" data-q="この語の語源を教えてください">語源を聞く</button></div>'
      +'<form><input type="text" maxlength="200" enterkeyhint="send" placeholder="KANTAくんとして先生に聞く" aria-label="Claude先生に聞く"><button type="submit">送信</button></form></div>';
  }
  /* 長押し面（E-origin）：1 出会った一文（語を太字） 2 確認済みの語源だけ 3 Claude に聞く欄。出自のない語は 2 から */
  function etymHTML(c){
    var os=(c.origin||[]).filter(function(o){ return o.sentence; });
    if(!os.length && c.sentence) os=[{ tr:c.tr, sentence:c.sentence }];
    var trs=(c.origin||[]).map(function(o){ return o.tr; }).filter(Boolean);
    if(!trs.length && c.tr) trs=[c.tr];
    trs=trs.filter(function(t,i){ return trs.indexOf(t)===i; });
    var et=c.etymology||{};
    return '<h1'+(c.word.length>10 ? ' class="l"' : '')+'>'+esc(c.word)+'</h1>'
      +(trs.length ? '<p class="old trs">'+trs.map(function(t){ return '<button type="button" class="trbtn" data-tr="'+esc(t)+'">'+esc(t)+'　全文 ›</button>'; }).join('')+'</p>' : (c.set==='met' ? '<p class="old">出会った語</p>' : ''))
      +os.map(function(o){ return '<p class="sent">'+boldIn(o.sentence, c.word)+'</p>'; }).join('')
      +(et.verified ? (et.origin ? '<p class="old">'+esc(et.origin)+'</p>' : '')+(et.paragraphs||[]).map(function(p){ return '<p>'+esc(p)+'</p>'; }).join('') : '')
      +chatBoxHTML()
      +'<div class="src"><span></span><button type="button" class="close">カードに戻る</button></div>';
  }

  /* =====================================================
     Claude を直接呼ぶ（B-live）。鍵はこの端末の localStorage にだけ置く
     ===================================================== */
  var APIKEY='eigo:apikey', MODEL='claude-sonnet-5-5';
  function apiKey(){ try{ return localStorage.getItem(APIKEY)||''; }catch(e){ return ''; } }
  function online(){ return navigator.onLine !== false; }

  /* 鍵の入力。保存できたら true で resolve */
  function askKey(){
    var dlg=document.getElementById('keyDlg'), input=document.getElementById('keyInput');
    input.value='';
    return new Promise(function(resolve){
      function onClose(){
        dlg.removeEventListener('close', onClose);
        var k=dlg.returnValue==='save' ? input.value.trim() : '';
        input.value='';
        if(k){ try{ localStorage.setItem(APIKEY, k); }catch(e){} }
        resolve(!!(k && apiKey()));
      }
      dlg.returnValue='';
      dlg.addEventListener('close', onClose);
      dlg.showModal();
      input.focus();
    });
  }
  document.getElementById('keySave').addEventListener('click', function(e){ e.preventDefault(); document.getElementById('keyDlg').close('save'); });
  document.getElementById('keyCancel').addEventListener('click', function(){ document.getElementById('keyDlg').close(''); });

  /* =====================================================
     Claude先生に聞く（LINE 風）。右があなた＝KANTAくん、左が Claude先生。
     先生は会話の流れを踏まえて答える。会話は語ごとに残す（eigo:chats）。書き出しに含め、読み込みで戻す。
     話し方の手本は bunka-cards の掛け合い（sensei-samples.json、原文のまま）
     ===================================================== */
  var SAMPLES={};
  var SENSEI='あなたは「Claude先生」。『必修英文100題』などで英文読解を学ぶ「KANTAくん」の質問に、LINE のチャットで答える。\n'
    +'KANTAくんは英単語を字面で誤解したり、カタカナ語や身近な例に引き寄せたり、ちょっとボケたりする。\n'
    +'答え方：\n'
    +'・まず誤解があれば、やさしく正す（「〜ではありません」「逆です」）。\n'
    +'・すぐ核心を短く言う。2〜3文、全体で150字以内（語源を聞かれたときは200字以内でよい）。です・ます調。前置きや見出し、箇条書き、記号での強調は使わない。\n'
    +'・語源や短い例文、似た語との使い分けを一つ添えると覚えやすい。ボケには軽く乗ってから論点に戻す。\n'
    +'・下の語カードの内容を前提にする。出会った一文があれば、その文脈に沿って答える。カードにない事実は確かなものだけを述べ、不確かなときはそう言う。\n'
    +'・KANTAくんの誤読の記録があれば、なぜそう読み違えやすいかにも触れてよい。\n';
  function sampleDialogs(){
    return Object.keys(SAMPLES).slice(0, 2).map(function(id){
      return '（'+id+'）\n'+SAMPLES[id].map(function(m){ return (m.who==='k' ? 'KANTAくん：' : 'Claude先生：')+m.text; }).join('\n');
    }).join('\n\n');
  }
  /* 語カードの内容をそのまま渡す：語・意味・出会った一文・誤読 */
  function cardContext(c){
    var os=(c.origin||[]).filter(function(o){ return o.sentence; }).map(function(o){ return (o.tr ? o.tr+'：' : '')+o.sentence; });
    if(!os.length && c.sentence) os=[(c.tr ? c.tr+'：' : '')+c.sentence];
    var mis=misreads(c);
    return '語：'+c.word+'\n'
      +'意味：'+(c.senses||[]).concat((c.senses_noun||[]).map(function(n){ return '（名）'+n; })).join('／')+'\n'
      +(os.length ? '出会った一文：\n'+os.join('\n')+'\n' : '')
      +(mis.length ? 'KANTAくんの誤読：'+mis.join('、')+'\n' : '');
  }
  function bubble(who, text, extra){ return bubbleHTML(who, esc(text), extra); }
  function bubbleHTML(who, html, extra, pcls){
    return '<div class="msg '+who+(extra ? ' '+extra : '')+'"><span class="av" aria-hidden="true">'+(who==='k' ? 'K' : '先')+'</span>'
      +'<div class="bub"><span class="who">'+(who==='k' ? 'KANTAくん' : 'Claude先生')+'</span><p'+(pcls ? ' class="'+pcls+'"' : '')+'>'+html+'</p></div></div>';
  }
  var CHATS='eigo:chats', CHAT_KEEP=200, CHAT_SEND=16;
  function loadChats(){ try{ var o=JSON.parse(localStorage.getItem(CHATS)); return o && typeof o==='object' && !Array.isArray(o) ? o : {}; }catch(e){ return {}; } }
  function saveChats(o){ try{ localStorage.setItem(CHATS, JSON.stringify(o)); }catch(e){} }
  /* 直近 CHAT_SEND 件を送る。会話は必ず KANTAくん（user）から始まる決まりなので、先頭が先生なら1件落とす。
     送り直すたびに同じになる部分（新しい質問の1つ前まで）にキャッシュの印を付ける */
  function chatPayload(msgs){
    var m=msgs.slice(-CHAT_SEND);
    if(m.length && m[0].role!=='user') m=m.slice(1);
    return m.map(function(x, i){
      return i===m.length-2 ? { role:x.role, content:[{ type:'text', text:x.content, cache_control:{ type:'ephemeral' } }] } : { role:x.role, content:x.content };
    });
  }

  function callClaude(system, user){
    return fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'x-api-key':apiKey(),
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true',
        'content-type':'application/json'
      },
      /* Sonnet 5.5 は指定しないと思考してから答え、その分も max_tokens に数えられて本文が途中で切れる。
         ツールを使わないので between_tools で思考を止め、800 を本文に回す（bunka-cards と同じ） */
      body:JSON.stringify({ model:MODEL, max_tokens:800, thinking:{ type:'between_tools' }, system:system, messages:Array.isArray(user) ? user : [{ role:'user', content:user }] })
    }).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(d){
        if(!r.ok){ var err=new Error((d.error && d.error.message) || ('HTTP '+r.status)); err.status=r.status; throw err; }
        if(d.stop_reason==='refusal'){ var rf=new Error('この質問には答えられませんでした'); rf.status='refusal'; throw rf; }
        var text=(d.content||[]).filter(function(b){ return b.type==='text'; }).map(function(b){ return b.text; }).join('').trim();
        if(d.stop_reason==='max_tokens') text+=' …（長さの上限で途中で切れました）';
        return text;
      });
    });
  }

  /* 圏外のときは送信ボタンを灰色にして「圏外」と出す。カード・開封・小テストは影響なし */
  function renderNet(){
    var off=!online();
    document.querySelectorAll('.chat').forEach(function(box){
      var busy=!!box.dataset.busy;
      box.querySelector('form button').disabled=off || busy; box.querySelector('form button').textContent=off ? '圏外' : '送信';
      box.querySelector('.chat-go').disabled=off || busy; box.querySelector('.chat-go').textContent=off ? '語源を聞く　圏外' : '語源を聞く';
      box.classList.toggle('nokey', off || !apiKey());
    });
  }
  window.addEventListener('online', renderNet);
  window.addEventListener('offline', renderNet);

  function bindChat(box, c){
    var form=box.querySelector('form'), input=box.querySelector('input'), btn=form.querySelector('button'), log=box.querySelector('.chat-log');
    var tools=box.querySelector('.chat-tools'), saved=loadChats()[c.id]||[], msgs, busy=false;
    function render(){
      /* 定型のやりとり（覚えた気がする）は表示だけ。先生が言っていないセリフなので API には送らない */
      msgs=saved.filter(function(m){ return !m.canned; }).map(function(m){ return { role:m.role, content:m.content }; });
      log.innerHTML=saved.map(function(m){ return bubble(m.role==='user' ? 'k' : 't', m.content); }).join('');
      tools.hidden=!saved.length;
    }
    render();
    box.querySelector('.chat-clear').addEventListener('click', function(){
      if(busy || !confirm('《'+c.word+'》の会話を消します')) return;
      var all=loadChats(); delete all[c.id]; saveChats(all);
      saved=[]; render();
    });
    function add(html){
      log.insertAdjacentHTML('beforeend', html);
      var last=log.lastElementChild; if(last && last.scrollIntoView) last.scrollIntoView({ block:'nearest', behavior:'smooth' });
      return last;
    }
    function send(q){
      if(busy || !online() || !q) return;
      (apiKey() ? Promise.resolve(true) : askKey()).then(function(ok){
        box.classList.toggle('nokey', !apiKey());
        if(!ok) return;
        input.value='';
        add(bubble('k', q, 'new'));
        msgs.push({ role:'user', content:q });
        busy=true; box.dataset.busy='1'; renderNet();
        var typing=add(bubble('t', '…', 'typing'));
        /* 変わらない部分（先生の決まり＋話し方の手本）を先に置き、キャッシュの印を付ける。語ごとに変わる語カードはその後ろ */
        var system=[{ type:'text', text:SENSEI+'\n【話し方の手本（別の分野の掛け合い）】\n'+sampleDialogs(), cache_control:{ type:'ephemeral' } },
                    { type:'text', text:'\n【語カード】\n'+cardContext(c) }];
        callClaude(system, chatPayload(msgs)).then(function(text){
          typing.remove();
          text=text || '（答えが空でした）';
          msgs.push({ role:'assistant', content:text });
          add(bubble('t', text, 'new'));
          /* 答えが返った問いと答えの組だけ残す */
          var now=Date.now(), all=loadChats();
          saved=saved.concat([{ role:'user', content:q, at:now }, { role:'assistant', content:text, at:now }]).slice(-CHAT_KEEP);
          all[c.id]=saved; saveChats(all);
          tools.hidden=false;
        }, function(err){
          typing.remove();
          msgs.pop();   /* 答えられなかった質問は会話に残さない（次に送るときの順番が崩れないように） */
          add(bubble('t', err.status==='refusal' ? err.message : err.status===401 ? '鍵が正しくないようです。コレクション画面の「鍵を消す」から入れ直してください。'
            : err.status ? 'うまく答えられませんでした（'+err.status+'：'+err.message+'）' : '通信できませんでした。もう一度送ってください', 'err'));
        }).then(function(){ busy=false; delete box.dataset.busy; renderNet(); });
      });
    }
    box.querySelector('.chat-go').addEventListener('click', function(){ send(this.dataset.q); });
    form.addEventListener('submit', function(e){ e.preventDefault(); send(input.value.trim()); });
    renderNet();
  }

  /* =====================================================
     TR の全文。本文・模範和訳・SVO は公開しないファイル（必修英文100題_本文データ.json）を
     コレクション画面の「読み込み」で一度取り込み、この端末の localStorage にだけ置く。
     書いた和訳は TR ごとに残し（eigo:mytr）、書き出しに含める
     ===================================================== */
  var PSG_KEY='eigo:passages', MYTR_KEY='eigo:mytr';
  function loadPassages(){ try{ var o=JSON.parse(localStorage.getItem(PSG_KEY)); return o && Array.isArray(o.passages) ? o : null; }catch(e){ return null; } }
  function loadMyTr(){ try{ var o=JSON.parse(localStorage.getItem(MYTR_KEY)); return o && typeof o==='object' && !Array.isArray(o) ? o : {}; }catch(e){ return {}; } }
  function saveMyTr(o){ try{ localStorage.setItem(MYTR_KEY, JSON.stringify(o)); }catch(e){} }

  /* SVO の記法：[ ] ( ) < > でまとまり、_ … _ で動詞の下線、語^S で語の下に記号（かっこの直後ならかっこの下）。\( \) は本文の丸かっこ。
     説明（S=主語 など）は各題で最初に出たときだけ付ける */
  var SVO_NAME={ S:'主語', V:'動詞', O:'目的語', C:'補語', M:'修飾', A:'名詞の説明' };
  function renderSVO(src, seen){
    var out='', word='', i=0, under=false, OPEN={ '[':'n', '(':'a', '<':'m' }, CLOSE={ ']':'n', ')':'a', '>':'m' };
    function flush(){ if(word){ out+=esc(word); word=''; } }
    while(i<src.length){
      var ch=src[i];
      if(ch==='\\' && (src[i+1]==='(' || src[i+1]===')')){ word+=src[i+1]; i+=2; continue; }
      if(OPEN[ch] || CLOSE[ch]){ flush(); out+='<span class="bk '+(OPEN[ch]||CLOSE[ch])+(OPEN[ch] ? ' o' : ' c')+'" data-c="'+esc(ch)+'"></span>'; i++; continue; }
      if(ch==='_'){ flush(); out+= under ? '</span>' : '<span class="u">'; under=!under; i++; continue; }
      if(ch==='^'){
        var m=/^\^([SVOCMA]['’]?)/.exec(src.slice(i));
        if(!m){ word+=ch; i++; continue; }
        var lab=m[1], cls=lab[0]+(lab.length>1 ? ' sub' : ''), mark=(lab[0]==='A' ? '形' : lab[0])+lab.slice(1);
        var text=seen[lab[0]] ? mark : mark+'='+SVO_NAME[lab[0]];
        if(!seen[lab[0]]){ seen[lab[0]]=1; cls+=' long'; }
        if(!word && /<span class="bk [nam] [oc]" data-c="[^"]*"><\/span>$/.test(out)){
          out=out.replace(/(<span class="bk [nam] [oc]" data-c="[^"]*"><\/span>)$/, '<span class="w">$1<span class="lb '+cls+'">'+esc(text)+'</span></span>');
          i+=m[0].length; if(src[i]===' ') i++; continue;
        }
        var k=word.lastIndexOf(' ')+1, head=word.slice(0,k), w=word.slice(k);
        out+=esc(head)+'<span class="w">'+esc(w)+'<span class="lb '+cls+'">'+esc(text)+'</span></span>'; word='';
        i+=m[0].length; continue;
      }
      if(ch===' '){ flush(); out+=' '; i++; continue; }
      word+=ch; i++;
    }
    flush(); if(under) out+='</span>';
    return out;
  }
  /* 間に文字のないかっこの並びに、外側ほど大きいずらし量（--k）を付ける */
  function spaceBrackets(root){
    var w=document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT|NodeFilter.SHOW_TEXT, null), run=[], n;
    function end(){
      var opens=run.filter(function(b){ return b.classList.contains('o'); }), closes=run.filter(function(b){ return b.classList.contains('c'); });
      opens.forEach(function(b, i){ b.style.setProperty('--k', opens.length-1-i); });
      closes.forEach(function(b, i){ b.style.setProperty('--k', i); });
      run=[];
    }
    while((n=w.nextNode())){
      if(n.nodeType===1 && n.classList.contains('bk')) run.push(n);
      else if(n.nodeType===3 && n.nodeValue.length && !(n.parentNode.classList && n.parentNode.classList.contains('lb'))) end();
    }
    end();
  }
  /* 記号どうしが同じ行で重なったら、後ろの記号を右へずらす */
  function unclash(root){
    root.querySelectorAll('.lb').forEach(function(lb){ lb.style.marginLeft=''; });
    var prev=null, edge=root.getBoundingClientRect().right;
    root.querySelectorAll('.lb').forEach(function(lb){
      var r=lb.getBoundingClientRect(), d=0;
      if(prev && Math.abs(r.top-prev.top)<4 && r.left<prev.right+6) d=prev.right+6-r.left;
      /* 右端からはみ出す記号は内側へ戻す */
      if(r.right+d>edge) d=edge-r.right;
      if(d){ lb.style.marginLeft=d+'px'; r=lb.getBoundingClientRect(); }
      prev=r;
    });
  }

  var psg=document.getElementById('psg'), psgBody=document.getElementById('psgBody'), psgTimer=0;
  function openPassage(tr){
    var pk=loadPassages(), p=pk && pk.passages.filter(function(x){ return x.tr===tr; })[0];
    document.getElementById('psgTitle').textContent=tr;
    if(!p){
      psgBody.innerHTML='<p class="psg-empty">本文がまだこの端末に入っていません。<br>iCloud Drive の eigo-words フォルダにある「必修英文100題_本文データ.json」を、コレクション画面の「読み込み」から一度読み込んでください。</p>';
    }else{
      var seen={}, mine=(loadMyTr()[tr]||{}).text||'';
      psgBody.innerHTML='<div class="psg-tools"><button type="button" class="psg-svo-btn">SVO で分ける</button></div>'
        +'<p class="psg-legend"><b style="color:var(--n)">[ ]</b> 名詞のまとまり　<b style="color:var(--a)">( )</b> 名詞の説明　<b style="color:var(--m)">&lt; &gt;</b> 副詞のまとまり　下線は動詞</p>'
        +'<div class="psg-flow svo">'+((p.svo||[]).length ? p.svo.map(function(m){ return renderSVO(m, seen); }).join(' ') : esc(p.text))+'</div>'
        +'<h3>和訳</h3><textarea class="psg-my" placeholder="ここに和訳を書く" aria-label="'+esc(tr)+' の和訳">'+esc(mine)+'</textarea><div class="psg-saved"></div>'
        +'<button type="button" class="psg-model-btn">模範解答を見る</button>'
        +'<div class="psg-model-text" hidden><p style="margin:0">'+esc(p.translation||'')+'</p><p class="psg-note">模範解答は Claude が作った下書きです。</p></div>'
        +'<h3>先生に見てもらう</h3><div class="psg-review"><button type="button" class="psg-review-btn">先生に見てもらう</button>'
        +'<p class="psg-note">書いた和訳を Claude先生が読んで、誤訳・訳抜け・構文の取り違えを指摘します（点数は付けません）。</p>'
        +'<div class="psg-reviews"></div></div>';
      var svoBtn=psgBody.querySelector('.psg-svo-btn'), flow=psgBody.querySelector('.psg-flow'), legend=psgBody.querySelector('.psg-legend');
      spaceBrackets(flow);
      svoBtn.addEventListener('click', function(){
        var on=!flow.classList.contains('on');
        flow.classList.toggle('on', on); legend.classList.toggle('on', on);
        svoBtn.classList.toggle('on', on); svoBtn.textContent=on ? '元の英文に戻す' : 'SVO で分ける';
        if(on) requestAnimationFrame(function(){ unclash(flow); });
      });
      var modelBtn=psgBody.querySelector('.psg-model-btn'), model=psgBody.querySelector('.psg-model-text');
      modelBtn.addEventListener('click', function(){
        model.hidden=!model.hidden; modelBtn.classList.toggle('on', !model.hidden);
        modelBtn.textContent=model.hidden ? '模範解答を見る' : '模範解答を隠す';
      });
      var ta=psgBody.querySelector('.psg-my'), saved=psgBody.querySelector('.psg-saved');
      bindReview(psgBody, tr, p, ta);
      ta.addEventListener('input', function(){
        clearTimeout(psgTimer); saved.textContent='';
        psgTimer=setTimeout(function(){
          var all=loadMyTr(), ent=all[tr]||{};
          ent.text=ta.value; ent.at=Date.now();
          if(!ta.value.trim() && !(ent.reviews||[]).length) delete all[tr]; else all[tr]=ent;
          saveMyTr(all); saved.textContent='保存しました';
        }, 600);
      });
    }
    psg.scrollTop=0; psg.classList.add('on'); psg.setAttribute('aria-hidden','false');
    document.getElementById('psgClose').focus({ preventScroll:true });
  }
  /* 和訳を先生に見てもらう。英文・SVO 分解・模範和訳（下書き）を先生に渡し、指摘だけを返してもらう。
     結果は TR ごとに和訳と一緒に残す（eigo:mytr の reviews、最大30件）。書き出しに含まれる */
  var REVIEW='あなたは「Claude先生」。『必修英文100題』で英文読解を学ぶ「KANTAくん」が書いた和訳を読み、指摘だけを返す。点数や合否は付けない。\n'
    +'見るところ：\n・誤訳（意味の取り違え）、訳抜け、構文の取り違え（下の SVO 分解に照らして、主語・動詞・目的語・補語や、修飾のかかり方がずれていないか）。\n'
    +'・日本語として不自然で、意味が伝わりにくいところ。\n'
    +'返し方：\n・です・ます調。前置きは要らない。指摘は大事なものから最大4つ。箇条は「・」で始める。\n'
    +'・各指摘は「英文の該当箇所（短く引用）→ 何がずれているか → どう直すとよいか」を1〜2文で書く。\n'
    +'・模範和訳は参考。KANTAくんの訳が別の表現でも意味を正しく取れていれば、模範どおりでなくても指摘しない。模範和訳の全文は書き写さない。\n'
    +'・大きな問題がなければそう伝え、よくできている点を一つ添える。\n'
    +'・全体で400字以内。見出しや記号での強調は使わない。\n'
    +'【SVO 分解の記法】[ ] 名詞のまとまり、( ) 名詞を説明するまとまり、< > 副詞のまとまり、_ … _ 動詞。語の直後の ^S ^V ^O ^C ^M ^A はその語の役割（主語・動詞・目的語・補語・修飾・名詞の説明）、\' は節の中。\n';
  function fmtTime(t){ var d=new Date(t); return (d.getMonth()+1)+'/'+d.getDate()+' '+d.getHours()+':'+('0'+d.getMinutes()).slice(-2); }
  function reviewHTML(r){
    return '<div class="rv"><div class="rv-date">'+esc(fmtTime(r.at))+' の和訳への指摘</div>'+bubble('t', r.review)
      +'<details><summary>このときの和訳</summary><p>'+esc(r.mine)+'</p></details></div>';
  }
  function bindReview(root, tr, p, ta){
    var btn=root.querySelector('.psg-review-btn'), list=root.querySelector('.psg-reviews'), busy=false;
    function render(){ list.innerHTML=((loadMyTr()[tr]||{}).reviews||[]).slice().reverse().map(reviewHTML).join(''); }
    function net(){ btn.disabled=busy || !online(); btn.textContent=!online() ? '圏外' : busy ? '先生が読んでいます…' : '先生に見てもらう'; }
    render(); net();
    window.addEventListener('online', net); window.addEventListener('offline', net);
    btn.addEventListener('click', function(){
      var mine=ta.value.trim();
      if(busy || !online()) return;
      if(!mine){ alert('和訳を書いてから押してください'); ta.focus(); return; }
      (apiKey() ? Promise.resolve(true) : askKey()).then(function(ok){
        if(!ok) return;
        busy=true; net();
        list.insertAdjacentHTML('afterbegin', '<div class="rv rv-wait">'+bubble('t', '…', 'typing')+'</div>');
        var system=[{ type:'text', text:REVIEW, cache_control:{ type:'ephemeral' } },
          { type:'text', text:'\n【英文】'+tr+'\n'+p.text+'\n\n【SVO 分解】\n'+(p.svo||[]).join('\n')+'\n\n【模範和訳（下書き）】\n'+(p.translation||'') }];
        callClaude(system, '【KANTAくんの和訳】\n'+mine).then(function(text){
          var all=loadMyTr(), ent=all[tr]||{ text:ta.value, at:Date.now() };
          ent.reviews=(ent.reviews||[]).concat([{ at:Date.now(), mine:mine, review:text || '（答えが空でした）' }]).slice(-30);
          all[tr]=ent; saveMyTr(all);
          render();
        }, function(err){
          var w=list.querySelector('.rv-wait'); if(w) w.remove();
          list.insertAdjacentHTML('afterbegin', '<div class="rv">'+bubble('t', err.status==='refusal' ? err.message : err.status===401 ? '鍵が正しくないようです。コレクション画面の「鍵を消す」から入れ直してください。'
            : err.status ? 'うまく読めませんでした（'+err.status+'：'+err.message+'）' : '通信できませんでした。もう一度押してください', 'err')+'</div>');
        }).then(function(){ busy=false; net(); });
      });
    });
  }
  function closePassage(){ psg.classList.remove('on'); psg.setAttribute('aria-hidden','true'); }
  document.getElementById('psgClose').addEventListener('click', closePassage);
  psg.addEventListener('keydown', function(e){ if(e.key==='Escape' && !e.target.closest('textarea')) closePassage(); });
  window.addEventListener('resize', function(){ if(psg.classList.contains('on')) psg.querySelectorAll('.psg-flow.on').forEach(unclash); });

  var etym=document.getElementById('etym'), flash=document.getElementById('flash');
  var etymCard=null, etymDone=null;

  function showEtym(c, card, x, y, onClosed){
    etym.innerHTML=etymHTML(c);
    var closeBtn=etym.querySelector('.close');
    closeBtn.addEventListener('click', closeEtym);
    var cb=etym.querySelector('.chat'); if(cb) bindChat(cb, c);
    etym.querySelectorAll('.trbtn').forEach(function(b){ b.addEventListener('click', function(){ openPassage(b.dataset.tr); }); });
    etymCard=card; etymDone=onClosed;
    etym.style.setProperty('--cx', x+'px'); etym.style.setProperty('--cy', y+'px');
    setTimeout(function(){
      card.classList.add('burst');
      etym.classList.remove('hide'); etym.classList.add('show'); etym.setAttribute('aria-hidden','false');
      closeBtn.focus({preventScroll:true});
    },120);
  }
  function closeEtym(){
    if(!etymCard) return;
    var card=etymCard, done=etymDone; etymCard=null;
    etym.classList.remove('show'); etym.classList.add('hide'); etym.setAttribute('aria-hidden','true');
    card.classList.remove('burst');
    setTimeout(function(){ etym.classList.remove('hide'); if(done) done(); },520);
  }
  etym.addEventListener('keydown', function(e){ if(e.key==='Escape' && !e.target.closest('.chat')) closeEtym(); });

  /* ---- 操作（見本と同じ）。card.dataset.locked の間は反応しない ---- */
  function bindCard(card, c){
    var sparks=card.querySelector('.sparks');
    var HOLD=1100, TAP=300;
    var pressing=false, start=0, raf=0, sx=0, sy=0, moved=false, lastSpark=0, done=false, pid=null;

    function setP(p){ card.style.setProperty('--p', p.toFixed(3)); }

    function spawn(p){
      var s=document.createElement('span'); s.className='spark';
      s.style.left=(5+Math.random()*90)+'%';
      s.style.setProperty('--dx', ((Math.random()-.5)*60)+'px');
      s.style.setProperty('--dy', (60+Math.random()*180*(0.4+p))+'px');
      s.style.setProperty('--d', (0.7+Math.random()*0.6)+'s');
      s.style.width=s.style.height=(3+Math.random()*5)+'px';
      if(Math.random()<.25){ s.style.background='#c89b3c'; s.style.boxShadow='0 0 8px 2px rgba(200,155,60,.7)'; }
      sparks.appendChild(s);
      s.addEventListener('animationend', function(){ s.remove(); });
    }

    function loop(now){
      if(!pressing) return;
      var p=Math.min(1,(now-start)/HOLD);
      setP(p);
      var gap=140-120*p;
      if(now-lastSpark>gap){ spawn(p); lastSpark=now; if(p>.6) spawn(p); }
      if(p>=1){ complete(); return; }
      raf=requestAnimationFrame(loop);
    }

    function release(){
      pressing=false; cancelAnimationFrame(raf);
      card.classList.remove('press');
      try{ if(pid!==null) card.releasePointerCapture(pid); }catch(e){}
      pid=null;
      setP(0);
    }

    function complete(){
      if(done) return; done=true;
      pressing=false; cancelAnimationFrame(raf);
      card.classList.remove('press');
      try{ if(pid!==null) card.releasePointerCapture(pid); }catch(e){}
      for(var i=0;i<28;i++) spawn(1);
      flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');
      showEtym(c, card, sx, sy, function(){ done=false; });
      setTimeout(function(){ setP(0); },400);
    }

    card.addEventListener('pointerdown', function(e){
      if(done || card.dataset.locked) return;
      if(card.classList.contains('flipped')){ pressing=false; start=performance.now(); moved=false; sx=e.clientX; sy=e.clientY; return; }
      pressing=true; moved=false; start=performance.now(); lastSpark=start; sx=e.clientX; sy=e.clientY; pid=e.pointerId;
      try{ card.setPointerCapture(pid); }catch(err){}
      card.classList.add('press');
      raf=requestAnimationFrame(loop);
      e.preventDefault();
    });
    card.addEventListener('pointermove', function(e){
      if(Math.abs(e.clientX-sx)>12||Math.abs(e.clientY-sy)>12) moved=true;
      /* めくれる画面では、横に動かしたら長押しをやめる（スワイプと取り違えない） */
      if(pressing && card.dataset.swipe && Math.abs(e.clientX-sx)>14) release();
    });
    function up(e){
      if(done || card.dataset.locked) return;
      var dt=performance.now()-start;
      var wasPressing=pressing;
      if(wasPressing) release();
      if(dt<TAP && !moved) card.classList.toggle('flipped');
    }
    card.addEventListener('pointerup', up);
    card.addEventListener('pointercancel', function(){ if(pressing) release(); });
    card.addEventListener('contextmenu', function(e){ e.preventDefault(); });
    card.addEventListener('keydown', function(e){
      if(card.dataset.locked) return;
      if(e.key===' '||e.key==='Enter'){ e.preventDefault(); card.classList.toggle('flipped'); }
      if(e.key==='e'||e.key==='E'){ sx=innerWidth/2; sy=innerHeight/2; complete(); }
    });
  }

  function mountCard(host, c, o){
    o=o||{};
    host.innerHTML=cardHTML(c, o.kira);
    var el=host.querySelector('.card');
    if(o.flipped) el.classList.add('flipped');
    if(o.locked) el.dataset.locked='1';
    if(o.swipe) el.dataset.swipe='1';
    if(!o.inert) bindCard(el, c);
    return el;
  }

  /* =====================================================
     状態（localStorage）
     ===================================================== */
  var HOUR=3600e3, FULL=6*HOUR, PACK=5, PACK_NEW=2, RECALL=3000, SHOW_ANSWER=3000;
  var KEY='eitango.v1';

  function fresh(){
    return {
      v:1,
      owned:{},          /* id → { order, first, met, kira } */
      nextOrder:1,
      charge:2*FULL,     /* ゲージ（ms）。初期は2パック分 */
      chargeAt:Date.now(),
      points:0,
      lastOpen:null,
      quizLog:{},        /* id → 出題日 'YYYY-MM-DD'（当日分だけ残す） */
      pending:null       /* 開封途中のパック */
    };
  }
  function valid(s){ return s && s.v===1 && typeof s.owned==='object' && typeof s.charge==='number'; }
  function load(){
    try{ var s=JSON.parse(localStorage.getItem(KEY)); if(valid(s)) return s; }catch(e){}
    return fresh();
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

  /* ゲージは満タン未満のときだけ時間で溜まる。満タン以上（初期の2パック分など）はそのまま */
  function charge(){
    var c=S.charge;
    if(c<FULL) c=Math.min(FULL, c+Math.max(0, Date.now()-S.chargeAt));
    return c;
  }
  function settle(){ S.charge=charge(); S.chargeAt=Date.now(); }
  function pointsNeeded(){ var c=charge(); return c>=FULL ? 0 : Math.ceil((FULL-c)/HOUR); }

  function dayKey(t){
    var d=t ? new Date(t) : new Date();
    return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
  }
  function shuffle(a){
    a=a.slice();
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function fmt(ms){
    var m=Math.ceil(ms/60000), h=Math.floor(m/60); m=m%60;
    return h ? h+'時間'+(m ? m+'分' : '') : m+'分';
  }

  var S, CARDS=[], BYID={}, APPROVED=[], WORDS=[];

  /* =====================================================
     画面切り替え
     ===================================================== */
  var screens=['home','open','result','viewer','collection','quiz','quizEnd','ctest'];
  var current=null, homeTimer=0;
  function show(name){
    screens.forEach(function(s){ document.getElementById(s).classList.toggle('on', s===name); });
    current=name;
    clearInterval(homeTimer);
    if(name==='home'){ renderHome(); homeTimer=setInterval(renderHome, 20000); }
  }
  function $(id){ return document.getElementById(id); }

  /* =====================================================
     1. ホーム
     ===================================================== */
  var SET_NAME={ list:'初級', tr:'TR' };
  var packs=[].slice.call(document.querySelectorAll('.shelf .pack'));
  function setCards(set){ return APPROVED.filter(function(c){ return (c.set||'list')===set; }); }
  function renderHome(){
    var c=charge(), n=Math.floor(c/FULL), need=pointsNeeded();
    $('gaugeBar').style.setProperty('--g', Math.min(1, c/FULL).toFixed(3));
    $('gaugeTxt').innerHTML=n>=1 ? '<b>満タン</b><span>'+(n>=2 ? '×'+n : '')+'</span>' : '<span>あと '+fmt(FULL-c)+'</span><span></span>';
    var st='', can=false;
    if(S.pending){
      st=SET_NAME[S.pending.set||'list']+'パックの開封の続き'; can=true;
    }else if(!APPROVED.length){
      st='承認済みのカードがまだありません';
    }else if(n>=1){
      st='開けるパックを選んでください'; can=true;
    }else if(S.points>=need){
      st=need+'ポイントを使えば今すぐ開けられます'; can=true;
    }
    $('homeStatus').innerHTML=st+'<small>ポイント '+S.points+'</small>';
    packs.forEach(function(p){
      var set=p.dataset.set;
      var ok=can && setCards(set).length>0 && (!S.pending || (S.pending.set||'list')===set);
      p.classList.toggle('ready', ok);
      p.classList.toggle('locked', !ok);
      p.setAttribute('aria-label', SET_NAME[set]+'パック。'+(ok ? '開けられます' : '今は開けられません'));
    });
    var owned=Object.keys(S.owned).length;
    $('collBtn').textContent='コレクション　'+owned+'枚';
  }
  var pack=null;   /* 開封に選ばれたパック（破く画面で同じ絵柄を使う） */
  function tapPack(p){
    if(!p.classList.contains('ready')) return;
    pack=p;
    if(!S.pending){
      var set=p.dataset.set;
      settle();
      if(S.charge<FULL){
        var need=pointsNeeded();
        if(S.points<need) return;
        S.points-=need; S.charge+=need*HOUR;
      }
      S.charge-=FULL; S.chargeAt=Date.now(); S.lastOpen=Date.now();
      S.pending={ set:set, cards:composePack(set), idx:0, torn:false };
      save();
    }
    startOpen();
  }
  packs.forEach(function(p){
    p.addEventListener('click', function(){ tapPack(p); });
    p.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); tapPack(p); } });
  });

  /* 手持ち3枚（復習）＋未所持2枚（発見）。未所持が足りなければ手持ちで、手持ちが足りなければ未所持で埋める。
     発見を最後に置く。
     手持ちは「そのセット＋met」から。
     新規は met の未所持を先に引き（ランダム）、なくなったらそのセットの未所持から引く。
     TR の新規は TR 番号の小さい順（同じ TR の中はランダム）。初級の新規はランダム */
  function trNum(c){ return parseInt(String(c.tr||'').replace(/\D/g,''),10)||9999; }
  function composePack(set){
    var pool=APPROVED.filter(function(c){ var cs=c.set||'list'; return cs===set || cs==='met'; });
    var ids=pool.map(function(c){ return c.id; });
    var have=shuffle(ids.filter(function(id){ return S.owned[id]; }));
    var metNew=shuffle(pool.filter(function(c){ return c.set==='met' && !S.owned[c.id]; }).map(function(c){ return c.id; }));
    var setNew=shuffle(pool.filter(function(c){ return (c.set||'list')===set && !S.owned[c.id]; }).map(function(c){ return c.id; }));
    if(set==='tr') setNew.sort(function(a,b){ return trNum(BYID[a])-trNum(BYID[b]); });
    var fresh_=metNew.concat(setNew);
    var n=Math.min(PACK, ids.length);
    var nNew=Math.min(PACK_NEW, fresh_.length);
    var nOld=Math.min(n-nNew, have.length);
    nNew=Math.min(n-nOld, fresh_.length);
    return have.slice(0,nOld).map(function(id){ return { id:id, isNew:false, done:false }; })
      .concat(fresh_.slice(0,nNew).map(function(id){ return { id:id, isNew:true, done:false }; }));
  }

  /* =====================================================
     2. 開封：破く → 1枚ずつ反転 → 結果一覧
     ===================================================== */
  function startOpen(){
    var P=S.pending;
    show('open');
    if(!P.torn) renderTear(); else renderOpenCard();
  }

  function renderTear(){
    $('openCount').textContent='';
    $('openWord').textContent=''; $('openWord').classList.add('off');
    var set=S.pending.set||'list', art=pack||document.querySelector('.shelf .pack[data-set="'+set+'"]');
    $('openStage').innerHTML='<div class="tear-wrap"><div class="pack ready'+(set==='tr' ? ' tr' : '')+'" id="tearPack" tabindex="0" role="button" aria-label="パックを破く">'
      +art.innerHTML+'<div class="pk-top"><div class="pk-cut"></div></div></div></div>';
    $('openCtl').textContent='上の端を横になぞって破く';
    var tp=$('tearPack'), top=tp.querySelector('.pk-top'), sx=0, on=false, torn=false;
    tp.style.setProperty('--g','1');
    function setT(t){ top.style.setProperty('--t', t.toFixed(3)); }
    tp.addEventListener('pointerdown', function(e){
      if(torn) return; on=true; sx=e.clientX;
      try{ tp.setPointerCapture(e.pointerId); }catch(err){}
      e.preventDefault();
    });
    tp.addEventListener('pointermove', function(e){
      if(!on||torn) return;
      var t=Math.min(1, Math.abs(e.clientX-sx)/(tp.offsetWidth*.7));
      setT(t);
      if(t>=1) tear();
    });
    function end(){ if(!torn){ on=false; setT(0); } }
    tp.addEventListener('pointerup', end);
    tp.addEventListener('pointercancel', end);
    tp.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); setT(1); tear(); } });
    function tear(){
      if(torn) return; torn=true; on=false;
      tp.classList.add('torn');
      $('openCtl').textContent='';
      setTimeout(function(){ tp.classList.add('gone'); }, 380);
      setTimeout(function(){ S.pending.torn=true; save(); renderOpenCard(); }, 900);
    }
    tp.focus({preventScroll:true});
  }

  function renderOpenCard(){
    var P=S.pending, e=P.cards[P.idx], c=BYID[e.id];
    $('openCount').textContent=(P.idx+1)+' / '+P.cards.length;
    var w=$('openWord'); w.textContent=c.word; w.classList.remove('off');
    var o=S.owned[e.id];
    var card=mountCard($('openStage'), c, { kira:o&&o.kira, flipped:!e.done, locked:!e.done });
    var ctl=$('openCtl');
    if(e.done){ nextButton(); w.classList.add('off'); return; }

    if(e.isNew){
      ctl.innerHTML='<button type="button" class="btn" data-k="0">知ってる</button><button type="button" class="btn" data-k="1">知らない</button>';
      ctl.querySelectorAll('button').forEach(function(b){
        b.addEventListener('click', function(){
          var unknown=b.dataset.k==='1' || misreads(c).length>0;
          S.owned[e.id]={ order:S.nextOrder++, first:Date.now(), met:1, kira:unknown };
          e.done=true; save();
          if(unknown){ mountCard($('openStage'), c, { kira:true, flipped:true, locked:true }); card=$('openStage').querySelector('.card'); void card.offsetWidth; }
          reveal(card);
        });
      });
    }else{
      /* ダブり：反転前に意味を思い出す時間 */
      ctl.innerHTML='<span class="recall">意味を思い出す</span>';
      setTimeout(function(){
        if(current!=='open' || S.pending!==P || P.idx!==P.cards.indexOf(e)) return;
        S.owned[e.id].met++;
        e.done=true; save();
        reveal(card);
      }, RECALL);
    }
  }

  function reveal(card){
    $('openCtl').innerHTML='';
    $('openWord').classList.add('off');
    card.classList.remove('flipped');
    setTimeout(function(){ delete card.dataset.locked; nextButton(); }, 700);
  }

  function nextButton(){
    var P=S.pending, last=P.idx>=P.cards.length-1;
    $('openCtl').innerHTML='<button type="button" class="btn primary">'+(last ? '結果を見る' : '次へ')+'</button>';
    $('openCtl').querySelector('button').addEventListener('click', function(){
      if(last){ finishOpen(); return; }
      P.idx++; save(); renderOpenCard();
    });
  }

  function finishOpen(){
    var P=S.pending; S.pending=null; save();
    var list=$('resultList');
    list.innerHTML=P.cards.map(function(e){
      var c=BYID[e.id], o=S.owned[e.id];
      return '<div class="row"><b>'+esc(c.word)+'</b><span>'+esc((c.senses||[])[0]||'')+'</span>'
        +(e.isNew ? '<i class="tag">新しく出会った</i>' : '')
        +(o.kira ? '<i class="tag k">キラ</i>' : '')
        +'<em>会った '+o.met+'回</em></div>';
    }).join('');
    document.querySelector('#result .h2').textContent='今回の'+P.cards.length+'枚';
    show('result');
  }
  $('resultHome').addEventListener('click', function(){ show('home'); });

  /* =====================================================
     3. カード／4. コレクション
     ===================================================== */
  /* 初級／TR のどちらのコレクションか。出会った語（met）は TR 番号があれば TR、なければ初級 */
  var collSet=null;
  function collOf(c){ var st=c.set||'list'; return st==='met' ? (srcTr(c) ? 'tr' : 'list') : st; }
  function renderCollection(){
    var all=Object.keys(S.owned).filter(function(id){ return BYID[id]; })
      .sort(function(a,b){ return S.owned[a].order-S.owned[b].order; });
    document.querySelectorAll('.coll-btn').forEach(function(b){
      b.querySelector('span').textContent=all.filter(function(id){ return collOf(BYID[id])===b.dataset.set; }).length+'枚';
    });
    $('collPick').hidden=!!collSet; $('collView').hidden=!collSet;
    $('collClose').setAttribute('aria-label', collSet ? 'コレクションの選択に戻る' : '閉じる');
    if(!collSet) return;
    $('collTitle').textContent=(collSet==='tr' ? 'TR' : '初級')+'のコレクション';
    var ids=all.filter(function(id){ return collOf(BYID[id])===collSet; });
    var g=$('grid');
    $('ctBtn').hidden=!ids.length;
    if(!ids.length){ g.innerHTML='<div class="empty" style="grid-column:1/-1">まだカードがありません</div>'; return; }
    g.innerHTML=ids.map(function(id){
      var c=BYID[id], o=S.owned[id];
      return '<button type="button" class="tile'+(o.kira ? ' kira' : '')+'" data-id="'+esc(id)+'">'
        +(o.kira ? '<div class="holo"></div>' : '')
        +(srcTr(c) ? '<span class="badge">'+esc(srcTr(c))+'</span>' : '')
        +'<b>'+esc(c.word)+'</b>'
        +'<span class="tf">'+(!o.kira && o.learned ? '<em class="lrn">知らなかった→覚えた</em>' : '')+'<em>会った '+o.met+'回</em><i>'+(o.kira ? '◆◆◆' : '◇◇◇')+'</i></span></button>';
    }).join('');
  }
  function collIds(set){
    return Object.keys(S.owned).filter(function(id){ return BYID[id] && collOf(BYID[id])===set; })
      .sort(function(a,b){ return S.owned[a].order-S.owned[b].order; });
  }

  /* カードを開いた画面：並びはコレクションと同じ（出会った順）。端まで行ったら一周 */
  var view={ ids:[], i:0 }, claimTimers=[];
  function stopClaim(){ claimTimers.forEach(clearTimeout); claimTimers=[]; }
  function openView(d){
    stopClaim();
    var id=view.ids[view.i], c=BYID[id], st=$('viewerStage');
    var card=mountCard(st, c, { kira:S.owned[id].kira, swipe:true });
    st.classList.remove('in-l','in-r');
    if(d){ void st.offsetWidth; st.classList.add(d>0 ? 'in-l' : 'in-r'); }
    $('viewerN').textContent=view.ids.length>1 ? (view.i+1)+' / '+view.ids.length : '';
    $('viewerPrev').hidden=$('viewerNext').hidden=view.ids.length<2;
    $('viewerChat').innerHTML='';
    renderClaim();
    /* 「覚えた気がする」は表を見ているときだけ */
    new MutationObserver(renderClaim).observe(card, { attributes:true, attributeFilter:['class'] });
  }
  function renderClaim(){
    var id=view.ids[view.i], card=$('viewerStage').querySelector('.card'), b=$('claimBtn');
    b.hidden=!card || card.classList.contains('flipped');
    var claimed=!!(S.owned[id] && S.owned[id].claim);
    b.disabled=claimed; b.textContent=claimed ? '次のコレクションテストで確かめます' : '覚えた気がする';
  }
  function turn(d){
    if(current!=='viewer' || view.ids.length<2 || etymCard || psg.classList.contains('on')) return;
    view.i=(view.i+d+view.ids.length)%view.ids.length;
    openView(d);
  }
  $('grid').addEventListener('click', function(e){
    var t=e.target.closest('.tile'); if(!t) return;
    view.ids=collIds(collSet); view.i=Math.max(0, view.ids.indexOf(t.dataset.id));
    show('viewer');
    openView(0);
  });
  $('viewerPrev').addEventListener('click', function(){ turn(-1); });
  $('viewerNext').addEventListener('click', function(){ turn(1); });
  (function(){
    var st=$('viewerStage'), x0=0, y0=0, t0=0, on=false;
    st.addEventListener('pointerdown', function(e){ on=true; x0=e.clientX; y0=e.clientY; t0=performance.now(); });
    st.addEventListener('pointerup', function(e){
      if(!on) return; on=false;
      var dx=e.clientX-x0, dy=e.clientY-y0;
      if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.3 && performance.now()-t0<900) turn(dx<0 ? 1 : -1);
    });
    st.addEventListener('pointercancel', function(){ on=false; });
  })();
  document.addEventListener('keydown', function(e){

  var CLAIM_T=['ほんとですかね。まあ、信じましょう。',

  /* =====================================================
     5. 小テスト：全カードからランダム5問。英→日と日→英を交互に。
        4択の誤答は同じセット（初級は同じ品詞の区分、TR は構文以外／構文）から引く。
        構文カードは「一文を見せて、空所に入る構文を選ぶ」形にする
     ===================================================== */
  var Q=null, QITEMS=[];

  /* TR の構文：A・B・S・人・… などの型を含む句。1語の項目と、one's／oneself だけの熟語は除く */
  var CON_RE=/\.\.\.|…|(?:^|[^A-Za-z])[ABS](?![A-Za-z])|人|形容詞|倒置|強調|仮定法|付帯状況|関係代名詞|-ing|(?:^|[^A-Za-z])do(?![A-Za-z])|時間/;
  function bare(w){ return w.replace(/（.*?）/g,'').trim(); }
  function isConstruct(c){
    if(c.set!=='tr') return false;
    var b=bare(c.word);
    if(!/\s/.test(b) && !/仮定法/.test(b)) return false;
    return CON_RE.test(c.word);
  }
  /* 構文の決まった語（A・B・… などの型を除いた英単語）を、一文の中で順に空所にする */
  var HOLDERS={ a:1, b:1, s:1, v:1, 'do':1, "one's":1, oneself:1 };
  function blankSentence(sent, word){
    var toks=bare(word).split(/\s+/).filter(function(t){ return /^[A-Za-z][A-Za-z'’]*$/.test(t) && !HOLDERS[t.toLowerCase()]; });
    if(toks.length>1 && toks[0].toLowerCase()==='be') toks.shift();   /* 先頭の be は is/are/was に変わるので探さない */
    var out='', pos=0, hits=0, low=sent;
    toks.forEach(function(t){
      var re=new RegExp("(?<![A-Za-z'’-])"+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+(t.length>3 ? "[a-z'’]*" : '')+"(?![A-Za-z'’-])", 'ig');
      re.lastIndex=pos;
      var m=re.exec(low);
      if(!m) return;
      out+=esc(sent.slice(pos, m.index))+'<span class="blank">'+esc(m[0])+'</span>';
      pos=m.index+m[0].length; hits++;
    });
    return { html: out+esc(sent.slice(pos)), hits: hits };
  }
  function buildQuiz(){
    var inWords={}; WORDS.forEach(function(w){ inWords[w.id]=1; });
    QITEMS=WORDS.map(function(w){ return { id:w.id, word:w.word, meaning:w.meaning, set:'list', group:'list:'+w.category }; })
      .concat(APPROVED.filter(function(c){ return (c.set==='tr' || c.set==='met') && !inWords[c.id]; }).map(function(c){
        var con=isConstruct(c) || (c.set==='met' && c.tr && isConstruct({ set:'tr', word:c.word }));
        var sent=c.sentence || ((c.origin||[]).filter(function(o){ return o.sentence; })[0]||{}).sentence || '';
        /* TR から昇格した met は TR の仲間として出す。新しく来た met は met どうし（足りなければ TR から補う） */
        var grp=c.tr ? (con ? 'tr:con' : 'tr') : 'met';
        return { id:c.id, word:c.word, meaning:(c.senses||[])[0]||'', set:c.set, group:grp, sentence:sent, con:con && !!sent };
      }));
  }

  /* 初級テスト／TRテスト。出題範囲はコレクションと同じ振り分け（出会った語は TR 番号があれば TR）。
     まだ持っていないカードを優先して出し、正解したらそのカードを手に入れる */
  function quizSetOf(w){ var c=BYID[w.id]; return c ? collOf(c) : 'list'; }
  function startQuiz(set){
    var today=dayKey();
    Object.keys(S.quizLog).forEach(function(id){ if(S.quizLog[id]!==today) delete S.quizLog[id]; });
    var all=QITEMS.filter(function(w){ return quizSetOf(w)===set; });
    var fresh=all.filter(function(w){ return !S.quizLog[w.id]; });
    if(fresh.length<5) fresh=all;
    var notOwned=shuffle(fresh.filter(function(w){ return !S.owned[w.id]; })), owned=shuffle(fresh.filter(function(w){ return S.owned[w.id]; }));
    Q={ set:set, items:notOwned.concat(owned).slice(0,5), i:0, got:0, gained:[], busy:false };
    show('quiz');
    renderQ();
  }
  /* 4択：誤答は同じ区分から。足りないとき（出会った語の新規など）は同じテストの範囲から補う */
  function optionsFor(w, set){
    var ok=function(x){ return x.id!==w.id && x.meaning!==w.meaning && x.word!==w.word; };
    var others=shuffle(QITEMS.filter(function(x){ return x.group===w.group && ok(x); })).slice(0,3);
    if(others.length<3) others=others.concat(shuffle(QITEMS.filter(function(x){ return quizSetOf(x)===set && !x.con===!w.con && ok(x) && others.indexOf(x)<0; })).slice(0,3-others.length));
    return shuffle([w].concat(others));
  }
  function renderQ(){

  $('qOpts').addEventListener('click', function(e){

  $('quizListBtn').addEventListener('click', function(){ startQuiz('list'); });
  $('quizTrBtn').addEventListener('click', function(){ startQuiz('tr'); });
  $('quizClose').addEventListener('click', function(){ Q=null; $('qShow').classList.remove('on'); show('home'); });
  $('quizEndHome').addEventListener('click', function(){ show('home'); });

  /* =====================================================
     6. コレクションテスト：持っているカードの中から5問。LINE 風に先生が出題し、KANTAくん側の吹き出しから選ぶ。
        「覚えた気がする」と言った語から先に出す。同じ日の再出題の決まりは当てはめない。
        正解：1ポイント、キラ → ノーマル（覚えた）。不正解：キラに戻す。セリフは定型からランダム（API は使わない）
     ===================================================== */
  var CT_LINES={
    claimOk:{ t:['おお、本当に覚えていましたね。疑ってすみません。', '正解です。「気がする」じゃなくて、本当に覚えてましたね。', 'やりますね。約束どおりです。', '正解。これはもう、覚えたと言っていいですね。', 'お見事。宣言どおりでした。'],
              k:['ほら！ 言ったじゃないですか！', 'やった！ 信じてもらえてよかったです。', '当然です（内心ほっとしてます）。', 'よし！ 覚えた気がしたのは本物でした。', 'ふふん。次もどんどん出してください。'] },
    claimNg:{ t:['覚えたって言ってましたよね？ 覚えてないじゃないですか笑', 'あれ？ 「覚えた気がする」の「気がする」のほうでしたね笑', '……約束はどこへ行ったんでしょう笑', 'さっきの自信はどこへ行きました？笑', 'これは「覚えた気がしていた」でしたね笑'],
              k:['うわあ……完全に覚えたと思ったのに。', 'そんな……あのときは覚えてたんです……！', 'くっ……もう一回、覚え直します。', '恥ずかしい……次こそは本当に。', '気がしただけでした……。'] },
    ok:{ t:['正解です。よく分かってますね。', '正解。迷いがなかったですね。', 'その通りです。', '正解です。この調子でいきましょう。', 'いいですね、正解です。'],
         k:['よし！', 'これは分かりました！', 'やった、正解！', 'ふう、合ってた。', '余裕です（たぶん）。'] },
    ng:{ t:['残念、違います。', '惜しい……いえ、違います。', 'そこは引っかかりやすいところです。', '違います。でも、ここで間違えたら覚えられます。', 'ううん、違いますね。'],
         k:['あっ……そっちでしたか。', 'くやしい……！', '覚えたつもりだったのに……。', '次は間違えません。', 'えっ、そうなんですか。'] }
  };
  var CT=null;
  function ctStop(){ if(CT){ CT.timers.forEach(clearTimeout); CT=null; } }
  function startCollTest(set){
    ctStop();
    var own=QITEMS.filter(function(w){ return quizSetOf(w)===set && S.owned[w.id]; });
    if(!own.length) return;
    var claimed=shuffle(own.filter(function(w){ return S.owned[w.id].claim; })).sort(function(a,b){ return S.owned[a.id].claim-S.owned[b.id].claim; });
    var rest=shuffle(own.filter(function(w){ return !S.owned[w.id].claim; }));
    CT={ set:set, items:claimed.concat(rest).slice(0,5), i:0, got:0, toNormal:[], toKira:[], timers:[] };
    var log=$('ctLog'); log.innerHTML=''; $('ctN').textContent='';
    show('ctest'); $('ctest').scrollTop=0;
    var intro=(set==='tr' ? 'TR' : '初級')+'のコレクションから'+CT.items.length+'問出します。'
      +(claimed.length ? '\nまずは「覚えた気がする」と言っていた語からいきますよ。' : '');
    var run=CT;
    talk(log, 't', esc(intro), 900, run.timers).then(function(){ if(CT===run) ctAsk(); });
  }
  function ctAsk(){
    var run=CT, w=run.items[run.i], log=$('ctLog'), enja=run.i%2===0, html, pcls='';
    $('ctN').textContent=(run.i+1)+' / '+run.items.length;
    var n='第'+(run.i+1)+'問。';
    if(w.con){
      enja=false;
      html=esc(n+(blankSentence(w.sentence, w.word).hits ? '空所に入る構文はどれでしょう？' : 'この一文の構文はどれでしょう？'))+'<span class="sentq">'+blankSentence(w.sentence, w.word).html+'</span>';
    }else if(enja){
      html=esc(n+'《'+w.word+'》の意味はどれでしょう？');
    }else{
      html=esc(n+'「'+w.meaning+'」を英語で言うと？');
    }
    var opts=optionsFor(w, run.set), label=function(x){ return enja ? x.meaning : x.word; };
    talk(log, 't', html, 1000, run.timers).then(function(){
      if(CT!==run) return;
      log.insertAdjacentHTML('beforeend', '<div class="ct-opts">'+opts.map(function(x){
        return '<button type="button" class="ct-opt'+(enja ? '' : ' en')+'" data-id="'+esc(x.id)+'">'+esc(label(x))+'</button>';
      }).join('')+'</div>');
      var box=log.lastElementChild; scrollEnd(box);
      box.addEventListener('click', function(e){
        var b=e.target.closest('.ct-opt'); if(!b || CT!==run) return;
        var x=opts.filter(function(o){ return o.id===b.dataset.id; })[0];
        box.remove();
        log.insertAdjacentHTML('beforeend', bubbleHTML('k', esc(label(x)), 'new', enja ? '' : 'en')); scrollEnd(log.lastElementChild);
        ctJudge(w, x.id===w.id, label(w));
      });
    });
  }
  function ctJudge(w, right, answer){
    var run=CT, log=$('ctLog'), o=S.owned[w.id], c=BYID[w.id];
    var lines=CT_LINES[(o.claim ? 'claim' : '')+(right ? (o.claim ? 'Ok' : 'ok') : (o.claim ? 'Ng' : 'ng'))];
    if(right){
      run.got++; S.points++;
      if(o.kira){ o.kira=false; o.learned=Date.now(); run.toNormal.push(c.word); }
    }else{
      if(!o.kira){ o.kira=true; run.toKira.push(c.word); }
      delete o.learned;
    }
    delete o.claim; save();
    var t=pick(lines.t)+(right ? '' : '\n正解は「'+answer+'」です。');
    talk(log, 't', esc(t), 1300, run.timers)
      .then(function(){ return CT===run && talk(log, 'k', esc(pick(lines.k)), 1000, run.timers); })
      .then(function(){
        if(CT!==run) return;
        run.i++;
        if(run.i<run.items.length){ ctAsk(); return; }
        ctEnd();
      });
  }
  function ctEnd(){
    var run=CT, log=$('ctLog');
    var t='今日はここまで。'+run.items.length+'問中'+run.got+'問正解で、+'+run.got+'ポイントです（いま '+S.points+'ポイント）。'
      +(run.toNormal.length ? '\nキラ → ノーマル：'+run.toNormal.join('、') : '')
      +(run.toKira.length ? '\nノーマル → キラ：'+run.toKira.join('、') : '');
    talk(log, 't', esc(t), 1200, run.timers).then(function(){
      if(CT!==run) return;
      $('ctN').textContent='';
      log.insertAdjacentHTML('beforeend', '<button type="button" class="btn primary ct-end">コレクションに戻る</button>');
      var b=log.lastElementChild; scrollEnd(b);
      b.addEventListener('click', ctClose);
    });
  }
  function ctClose(){ ctStop(); renderCollection(); show('collection'); }
  $('ctBtn').addEventListener('click', function(){ startCollTest(collSet); });
  $('ctClose').addEventListener('click', ctClose);

  /* =====================================================
     起動
     ===================================================== */
  S=load();
  Promise.all([
    fetch('cards.json').then(function(r){ return r.json(); }),
    fetch('words.json').then(function(r){ return r.json(); }),
    /* 話し方の手本。読めなくても掛け合いは使える */
    fetch('sensei-samples.json').then(function(r){ return r.json(); }).catch(function(){ return {}; })
  ]).then(function(res){
    CARDS=res[0]; WORDS=res[1]; SAMPLES=res[2]||{};
    CARDS.forEach(function(c){ BYID[c.id]=c; });
    APPROVED=CARDS.filter(function(c){ return c.status==='approved'; });
    /* 誤読の記録がある手持ちは、あとから誤読が付いた語も含めてキラにする */
    /* ただし、コレクションテストで覚えたことを確かめた語（learned）はノーマルのまま */
    Object.keys(S.owned).forEach(function(id){ if(BYID[id] && misreads(BYID[id]).length && !S.owned[id].learned) S.owned[id].kira=true; });
    buildQuiz();
    /* TR セットを入れた日に限り、ゲージを2パック分足す（一度だけ） */
    if(!S.trBonus && APPROVED.some(function(c){ return c.set==='tr'; })){
      settle(); S.charge+=2*FULL; S.trBonus=dayKey();
    }
    /* 承認が取り消された語が開封途中のパックにあれば外す */
    if(S.pending){
      S.pending.cards=S.pending.cards.filter(function(e){ return BYID[e.id]; });
      if(!S.pending.cards.length || S.pending.idx>=S.pending.cards.length) S.pending=null;
    }
    save();
    show('home');
  });
  document.addEventListener('visibilitychange', function(){ if(!document.hidden && current==='home') renderHome(); });

  /* オフライン用（PWA） */
  if('serviceWorker' in navigator && location.protocol!=='file:'){
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }
})();
</script>
</body>
</html>
